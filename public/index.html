<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReShare - مشاركة الربح</title>
    <style>
        body {
            font-family: 'Tajawal', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .logo {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        h1 {
            color: #4a5568;
            margin-bottom: 10px;
        }
        p {
            color: #718096;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #5a6fd8;
        }
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
        }
        .feature {
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚀</div>
        <h1>مرحباً بك في ReShare</h1>
        <p>منصة مشاركة الربح الأولى - شارك الحملات واربح مع كل نقرة</p>
        
        <div class="features">
            <div class="feature">
                <strong>💰 أرباح حقيقية</strong>
                <p>اربح مع كل مشاركة ناجحة</p>
            </div>
            <div class="feature">
                <strong>🚀 سهولة الاستخدام</strong>
                <p>شارك وراقب أرباحك</p>
            </div>
            <div class="feature">
                <strong>📊 إحصائيات مباشرة</strong>
                <p>تتبع أداء مشاركاتك</p>
            </div>
            <div class="feature">
                <strong>🔗 روقات تتبع</strong>
                <p>روقات ذكية لتتبع النقرات</p>
            </div>
        </div>
        
        <p>التطبيق قيد التطوير - سيتم إطلاقه قريباً!</p>
        <a href="#" class="btn">تواصل معنا</a>
    </div>
</body>
</html>
