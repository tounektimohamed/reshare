<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReShare - أرباح من مشاركة الحملات الإعلانية</title>
    <script>
        // 🔥 CORRECTION - Redirection automatique si paramètres présents
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const route = urlParams.get('route');
            const screen = urlParams.get('screen');
            const ref = urlParams.get('referralCode') || urlParams.get('ref');
            
            // Si on a un paramètre d'inscription, rediriger vers la page d'inscription
            if (route === 'register' || screen === 'register') {
                let redirectUrl = '/register';
                if (ref) {
                    redirectUrl += `?ref=${encodeURIComponent(ref)}`;
                }
                window.location.href = redirectUrl;
                return;
            }
        });
    </script>
    <style>
        /* Votre CSS existant */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: white;
            line-height: 1.6;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        .logo {
            font-size: 4em;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            font-weight: 700;
        }
        p {
            font-size: 1.3em;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .btn {
            background: white;
            color: #667eea;
            padding: 18px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
            display: inline-block;
            margin: 10px;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚀</div>
        <h1>ReShare - ريشير</h1>
        <p>منصة رائدة لتحقيق دخل إضافي من خلال مشاركة الحملات الإعلانية</p>
        
        <div>
            <a href="https://reshare-ten.vercel.app" class="btn">🎯 إنشاء حساب جديد</a>
            <a href="https://reshare-ten.vercel.app" class="btn">📱 فتح التطبيق</a>
        </div>
    </div>
</body>
</html>
